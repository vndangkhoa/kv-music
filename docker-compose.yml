services:
  kv-music:
    # Pull from any of these registries:
    # docker.io/vndangkhoa/kv-music:latest
    # ghcr.io/vndangkhoa/kv-music:latest
    # git.khoavo.myds.me/vndangkhoa/kv-music:latest
    image: vndangkhoa/kv-music:latest
    container_name: kv-music
    restart: unless-stopped
    mem_limit: 500m
    cpus: 1.5
    # Host networking gives yt-dlp direct access to the host's native routed IPv6
    # on Linux/Synology without Docker bridge NAT66 issues.
    # If you prefer bridge networking (e.g. Docker Desktop on macOS/Windows),
    # comment out `network_mode: host`, set `PORT=8080`, and uncomment `ports`:
    network_mode: host
    # ports:
    #   - "3110:8080"
    environment:
      - PORT=3110
      - RUST_LOG=info
      - PYTHONUNBUFFERED=1
      - COOKIE_FILE=/app/cookies.txt
      # - FORCE_IPV6=0   # uncomment to force IPv4 for yt-dlp
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./data:/tmp/kv-music-downloads
      - ./cache:/tmp/kv-music-cache
      - ./cookies.txt:/app/cookies.txt:ro
      - ./users:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
