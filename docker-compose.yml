services:
  spotify-clone:
    image: git.khoavo.myds.me/vndangkhoa/spotify-clone:v4
    container_name: spotify-clone
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - RUST_ENV=production
    volumes:
      - ./data:/app/data
      - ./cache:/tmp/spotify-clone-cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
