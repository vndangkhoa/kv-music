<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KV Music Maskable Icon">
  <defs>
    <linearGradient id="kvMusicMaskBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="52%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#CC3700"/>
    </linearGradient>
    <linearGradient id="kvMusicMaskSheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="kvMusicMaskShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- Full-bleed background for adaptive/maskable launcher icons -->
  <rect width="512" height="512" fill="url(#kvMusicMaskBg)"/>
  <rect width="512" height="512" fill="url(#kvMusicMaskSheen)"/>
  <!-- Centered within inner 66% safe zone -->
  <circle cx="256" cy="256" r="135.3" fill="#111318" stroke="#FF6A00" stroke-opacity="0.36" stroke-width="3.5" filter="url(#kvMusicMaskShadow)"/>
  <circle cx="256" cy="256" r="118.6" stroke="#FF6A00" stroke-opacity="0.22" stroke-width="2"/>
  <!-- 7 Harmonic SoundCloud Waveform Bars -->
  <rect x="175.4" y="227.1" width="15.2" height="57.8" rx="7.6" fill="#FFE8D6" fill-opacity="0.96"/>
  <rect x="199.8" y="205.8" width="15.2" height="100.3" rx="7.6" fill="#FFFFFF" fill-opacity="0.96"/>
  <rect x="224.1" y="183.1" width="15.2" height="145.9" rx="7.6" fill="#FF6A00"/>
  <rect x="248.4" y="170.9" width="15.2" height="170.2" rx="7.6" fill="#FFFFFF"/>
  <rect x="272.7" y="190.7" width="15.2" height="130.7" rx="7.6" fill="#FF6A00"/>
  <rect x="297.0" y="213.4" width="15.2" height="85.1" rx="7.6" fill="#FFFFFF" fill-opacity="0.96"/>
  <rect x="321.4" y="230.9" width="15.2" height="50.2" rx="7.6" fill="#FFE8D6" fill-opacity="0.96"/>
</svg>
