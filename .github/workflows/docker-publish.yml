name: 🐳 Build & Push Docker Image – kv-music

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to all 3 registries ──────────────────────────────────────────

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: vndangkhoa
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: git.khoavo.myds.me
          username: vndangkhoa
          password: ${{ secrets.FORGEJO_TOKEN }}

      # ── Docker metadata / tags ─────────────────────────────────────────────

      - name: 🏷️ Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/vndangkhoa/kv-music
            ghcr.io/vndangkhoa/kv-music
            git.khoavo.myds.me/vndangkhoa/kv-music
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # ── Build & push ───────────────────────────────────────────────────────

      - name: 🚀 Build and push to all registries
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
